[platformio]
; Without this, `pio run` / `pio run -t upload` with no -e flag builds AND
; uploads every [env:] below in order - so it'd flash esp32dev then
; immediately overwrite it with display_test. Pin the plain command to the
; real clock firmware; the test sketch always needs an explicit -e flag.
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    bblanchon/ArduinoJson@^7.0.4
build_flags =
    -DUSER_SETUP_LOADED=1
    -include src/User_Setup_GC9A01.h

; Bare-bones display-only sketch (no WiFi/bridge/clock logic) for isolating
; wiring/driver problems. Flash with: pio run -e display_test -t upload -t monitor
[env:display_test]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter =
    -<*>
    +<../test_display/main.cpp>
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
build_flags =
    -DUSER_SETUP_LOADED=1
    -include src/User_Setup_GC9A01.h
